<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEMO Workforce - Database & Attrition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background: #f0f4f8; }
        .hidden { display: none; }
    </style>
</head>
<body class="min-h-screen">

    <div id="loginSection" class="flex items-center justify-center min-h-screen p-4">
        <div class="bg-white p-10 rounded-[3rem] shadow-2xl w-full max-w-md border-t-8 border-indigo-600 text-center">
            <h1 class="text-5xl font-black text-indigo-700 italic mb-8 tracking-tighter">MEMO</h1>
            <form id="loginForm" class="space-y-4 text-left">
                <input type="text" id="agentId" required class="w-full px-6 py-4 bg-gray-50 border-2 border-transparent rounded-2xl outline-none font-bold uppercase focus:border-indigo-500" placeholder="Agent ID">
                <input type="password" id="password" required class="w-full px-6 py-4 bg-gray-50 border-2 border-transparent rounded-2xl outline-none font-bold focus:border-indigo-500" placeholder="Password">
                <button type="submit" class="w-full bg-indigo-600 text-white py-5 rounded-2xl font-black text-lg hover:bg-indigo-700 transition transform hover:scale-105 shadow-lg">LOG IN</button>
            </form>
        </div>
    </div>

    <div id="mainDashboard" class="hidden p-8 max-w-7xl mx-auto">
        <nav class="flex justify-between items-center mb-8 bg-white p-6 rounded-[2.5rem] shadow-sm border border-white/50">
            <span class="text-3xl font-black text-indigo-900 italic tracking-tighter">MEMO</span>
            <div class="flex gap-4">
                <button id="adminBtn" onclick="showAdmin()" class="hidden bg-amber-500 text-white px-8 py-2 rounded-xl font-bold shadow-md hover:bg-amber-600">ADMIN CONSOLE</button>
                <button onclick="location.reload()" class="bg-red-50 text-red-500 px-4 py-2 rounded-xl font-bold text-sm">Logout</button>
            </div>
        </nav>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="bg-white p-8 rounded-[3rem] shadow-xl border-b-[12px] border-indigo-600">
                <h3 class="font-black text-gray-400 text-[10px] mb-6 uppercase tracking-widest">Personal Info</h3>
                <p id="userNameDisplay" class="text-2xl font-black text-indigo-900 mb-1"></p>
                <p id="userEmailDisplay" class="text-xs text-indigo-400 font-bold mb-8"></p>
                <div class="bg-indigo-50 p-6 rounded-3xl text-center">
                    <p class="text-[10px] font-bold text-indigo-300 uppercase">Shift Status</p>
                    <h4 id="todayShift" class="text-4xl font-black italic text-indigo-900">---</h4>
                </div>
            </div>

            <div class="lg:col-span-2 space-y-8">
                <div class="bg-white p-10 rounded-[3rem] shadow-xl flex justify-between items-center relative overflow-hidden">
                    <div class="z-10">
                        <p class="text-gray-400 font-bold text-xs uppercase mb-1">Live Tracker</p>
                        <h3 id="timer" class="text-7xl font-black text-slate-800 tracking-tighter">00:00:00</h3>
                    </div>
                    <button onclick="toggleBreak()" id="breakBtn" class="bg-indigo-600 text-white px-10 py-5 rounded-[2rem] font-black uppercase shadow-xl hover:bg-indigo-700 transition z-10">Take Break</button>
                    <div class="absolute right-[-20px] top-[-20px] w-40 h-40 bg-indigo-50 rounded-full blur-3xl opacity-50"></div>
                </div>
                <div class="bg-white p-8 rounded-[3rem] shadow-xl border-b-[12px] border-red-500">
                    <p class="text-xs font-bold text-red-400 uppercase mb-2">Missing Time Today</p>
                    <h4 id="missingHrs" class="text-5xl font-black italic text-red-600">9h</h4>
                </div>
            </div>
        </div>
    </div>

    <div id="adminPanel" class="hidden fixed inset-0 bg-slate-900/98 backdrop-blur-2xl z-50 p-6 overflow-y-auto">
        <div class="bg-white max-w-6xl mx-auto rounded-[4rem] p-10 shadow-2xl my-4">
            <div class="flex justify-between items-center mb-10">
                <div class="flex items-center gap-4">
                    <h2 class="text-3xl font-black text-indigo-900 uppercase italic">Control Room</h2>
                    <span class="bg-amber-100 text-amber-600 px-4 py-1 rounded-full text-[10px] font-black uppercase italic tracking-widest">Master Data</span>
                </div>
                <div class="flex gap-2">
                    <button onclick="addNewAgent()" class="bg-emerald-600 text-white px-6 py-2 rounded-xl font-bold text-xs shadow-lg hover:bg-emerald-700">+ NEW AGENT</button>
                    <button onclick="exportToExcel()" class="bg-indigo-600 text-white px-6 py-2 rounded-xl font-bold text-xs">EXPORT CSV</button>
                    <button onclick="hideAdmin()" class="bg-gray-100 px-6 py-2 rounded-xl font-bold text-xs text-gray-400">CLOSE</button>
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-4 gap-4 mb-10">
                <div class="bg-indigo-50 p-6 rounded-3xl border-l-8 border-indigo-500">
                    <p class="text-indigo-400 font-bold text-[10px] uppercase">Absenteeism</p>
                    <h5 id="adminAbsent" class="text-4xl font-black text-indigo-600">0%</h5>
                </div>
                <div class="bg-red-50 p-6 rounded-3xl border-l-8 border-red-500">
                    <p class="text-red-400 font-bold text-[10px] uppercase">Missing Hrs</p>
                    <h5 id="adminMissing" class="text-4xl font-black text-red-600">0h</h5>
                </div>
                <div class="bg-purple-50 p-6 rounded-3xl border-l-8 border-purple-500">
                    <p class="text-purple-400 font-bold text-[10px] uppercase">Attrition %</p>
                    <h5 id="adminAttrition" class="text-4xl font-black text-purple-600">0%</h5>
                </div>
                <div class="bg-emerald-50 p-6 rounded-3xl border-l-8 border-emerald-500">
                    <p class="text-emerald-400 font-bold text-[10px] uppercase">Active Staff</p>
                    <h5 id="adminActive" class="text-4xl font-black text-emerald-600">0</h5>
                </div>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead>
                        <tr class="text-left text-gray-400 text-[10px] font-black uppercase border-b border-gray-100">
                            <th class="pb-6 px-4">Staff Details</th>
                            <th class="pb-6 px-4">Agent ID</th>
                            <th class="pb-6 px-4">Shift</th>
                            <th class="pb-6 px-4">Status</th>
                            <th class="pb-6 px-4">Login</th>
                            <th class="pb-6 px-4 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="adminTable" class="text-sm font-bold text-slate-700"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // --- LIVE DATABASE ---
        let agents = {
            "MAV-015": { name: "Asmaa Hassan", email: "asmaa@memo.com", pass: "Welcome@123", role: "OWNER", shift: "10:00", active: true, login: null, missing: 9 },
            "MAV-000": { name: "Ahmed Zahran", email: "ahmed@memo.com", pass: "Zahran@Admin", role: "OWNER", shift: "10:00", active: true, login: null, missing: 9 },
            "MAV-001": { name: "Marwa Elatabany", email: "marwa@memo.com", pass: "123456", role: "MEMBER", shift: "OFF", active: true, login: null, missing: 0 }
        };

        let deletedCount = 0;
        let currentId = "";
        let workingSecs = 0;
        let isOnBreak = false;

        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const id = document.getElementById('agentId').value.toUpperCase().trim();
            const pw = document.getElementById('password').value.trim();
            
            if (agents[id] && agents[id].pass === pw) {
                if (!agents[id].active) { alert("ACCOUNT DEACTIVATED. Contact Asmaa."); return; }
                currentId = id;
                agents[id].login = new Date().toLocaleTimeString();
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('mainDashboard').classList.remove('hidden');
                startApp(id);
            } else { alert("ACCESS DENIED!"); }
        });

        function startApp(id) {
            const u = agents[id];
            document.getElementById('userNameDisplay').innerText = u.name;
            document.getElementById('userEmailDisplay').innerText = u.email;
            document.getElementById('todayShift').innerText = u.shift;
            if (u.role === "OWNER") document.getElementById('adminBtn').classList.remove('hidden');
            setInterval(() => { if(!isOnBreak && u.shift !== "OFF") { workingSecs++; updateUI(); } }, 1000);
        }

        function updateUI() {
            let h = Math.floor(workingSecs / 3600).toString().padStart(2, '0');
            let m = Math.floor((workingSecs % 3600) / 60).toString().padStart(2, '0');
            let s = (workingSecs % 60).toString().padStart(2, '0');
            document.getElementById('timer').innerText = `${h}:${m}:${s}`;
            let miss = Math.max(0, 9 - (workingSecs / 3600));
            document.getElementById('missingHrs').innerText = Math.round(miss) + "h";
            agents[currentId].missing = Math.round(miss);
        }

        function renderAdminTable() {
            const t = document.getElementById('adminTable');
            t.innerHTML = "";
            let totalMissing = 0, activeStaff = 0, totalShift = 0, abs = 0;
            
            for (let id in agents) {
                totalMissing += agents[id].missing;
                if(agents[id].active) activeStaff++;
                if(agents[id].shift !== "OFF") totalShift++;
                if(!agents[id].login && agents[id].shift !== "OFF") abs++;

                t.innerHTML += `
                    <tr class="border-b border-gray-50 h-20 hover:bg-slate-50 transition">
                        <td class="px-4"><div>${agents[id].name}</div><div class="text-[10px] text-indigo-400">${agents[id].email}</div></td>
                        <td class="px-4"><span class="bg-gray-100 px-2 py-1 rounded font-mono text-xs">${id}</span></td>
                        <td class="px-4">${agents[id].shift}</td>
                        <td class="px-4">
                            <span onclick="toggleStatus('${id}')" class="cursor-pointer px-3 py-1 rounded-full text-[10px] ${agents[id].active ? 'bg-green-100 text-green-600' : 'bg-red-100 text-red-600'}">
                                ${agents[id].active ? 'ACTIVE' : 'INACTIVE'}
                            </span>
                        </td>
                        <td class="px-4 ${agents[id].login ? 'text-green-500' : 'text-slate-300'}">${agents[id].login || '---'}</td>
                        <td class="px-4 text-right">
                            <button onclick="deleteAgent('${id}')" class="text-red-400 hover:text-red-600 font-black text-xs">DELETE</button>
                        </td>
                    </tr>`;
            }
            document.getElementById('adminAbsent').innerText = Math.round((abs/totalShift)*100) + "%";
            document.getElementById('adminMissing').innerText = totalMissing + "h";
            document.getElementById('adminActive').innerText = activeStaff;
            let totalHistorical = activeStaff + deletedCount;
            document.getElementById('adminAttrition').innerText = Math.round((deletedCount / (totalHistorical || 1)) * 100) + "%";
        }

        function toggleStatus(id) { agents[id].active = !agents[id].active; renderAdminTable(); }
        
        function deleteAgent(id) { 
            if(agents[id].role === "OWNER") return alert("Cannot delete Owners!");
            if(confirm("Are you sure you want to PERMANENTLY delete " + agents[id].name + "?")) {
                delete agents[id];
                deletedCount++;
                renderAdminTable();
            }
        }

        function addNewAgent() {
            const name = prompt("Agent Name:");
            const id = prompt("Agent ID (e.g. MAV-101):").toUpperCase();
            if (name && id) {
                agents[id] = { name, email: id.toLowerCase() + "@memo.com", pass: "123456", role: "MEMBER", shift: "10:00", active: true, login: null, missing: 9 };
                renderAdminTable();
            }
        }

        function exportToExcel() {
            let csv = "Name,ID,Shift,Status,Login,Missing\n";
            for (let id in agents) {
                csv += `${agents[id].name},${id},${agents[id].shift},${agents[id].active ? 'ACTIVE' : 'INACTIVE'},${agents[id].login || 'ABSENT'},${agents[id].missing}\n`;
            }
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = 'MEMO_Staff_Report.csv'; a.click();
        }

        function toggleBreak() { isOnBreak = !isOnBreak; document.getElementById('breakBtn').innerText = isOnBreak ? "Resume" : "Take Break"; document.getElementById('breakBtn').classList.toggle('bg-emerald-500'); }
        function showAdmin() { document.getElementById('adminPanel').classList.remove('hidden'); renderAdminTable(); }
        function hideAdmin() { document.getElementById('adminPanel').classList.add('hidden'); }
    </script>
</body>
</html>
