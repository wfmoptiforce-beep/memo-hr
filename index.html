<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEMO Workforce - Full Control</title>
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/912/912214.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background: #f0f4f8; }
        .hidden { display: none !important; }
        .card-anim:hover { transform: translateY(-10px); cursor: pointer; }
    </style>
</head>
<body class="min-h-screen">

    <div id="loginSection" class="flex items-center justify-center min-h-screen p-4">
        <div class="bg-white p-12 rounded-[3.5rem] shadow-2xl w-full max-w-md border-b-[15px] border-indigo-600 text-center">
            <h1 class="text-4xl font-black text-indigo-700 italic mb-2">MEMO</h1>
            <p class="text-gray-400 font-bold text-[10px] uppercase mb-8">Mavin Workforce Dashboard</p>
            <form id="loginForm" class="space-y-4 text-left">
                <input type="text" id="agentId" required autocomplete="username" class="w-full px-6 py-4 bg-slate-50 border-2 border-transparent rounded-2xl outline-none font-bold focus:border-indigo-500 uppercase" placeholder="AGENT ID">
                <input type="password" id="password" required autocomplete="current-password" class="w-full px-6 py-4 bg-slate-50 border-2 border-transparent rounded-2xl outline-none font-bold focus:border-indigo-500" placeholder="PASSWORD">
                <button type="submit" class="w-full bg-indigo-600 text-white py-5 rounded-2xl font-black text-lg shadow-xl hover:bg-indigo-700 transition">LOG IN</button>
            </form>
        </div>
    </div>

    <div id="mainDashboard" class="hidden">
        <nav class="bg-white p-6 shadow-sm flex justify-between items-center sticky top-0 z-50">
            <h1 class="text-2xl font-black text-indigo-600 italic tracking-tighter cursor-pointer" onclick="showView('home')">MEMO</h1>
            <button onclick="location.reload()" class="bg-red-50 text-red-500 px-4 py-2 rounded-xl font-bold text-xs uppercase">Logout</button>
        </nav>

        <div class="max-w-7xl mx-auto p-6">
            <button id="backBtn" onclick="showView('home')" class="hidden mb-6 bg-white px-6 py-3 rounded-2xl shadow-sm hover:bg-slate-50 font-black text-xs text-indigo-600 uppercase">⬅ Back to Menu</button>

            <div id="homeView" class="grid grid-cols-1 md:grid-cols-3 gap-8 mt-10">
                <div onclick="showView('tracker')" class="bg-white p-12 rounded-[3rem] shadow-xl border-b-[12px] border-indigo-500 card-anim">
                    <div class="text-5xl mb-6">⏱️</div>
                    <h3 class="text-3xl font-black text-slate-800 uppercase italic">Tracker</h3>
                    <p class="text-slate-400 font-bold text-xs mt-2 italic">Start shift & monitor hours</p>
                </div>
                <div onclick="showView('attendance')" class="bg-white p-12 rounded-[3rem] shadow-xl border-b-[12px] border-emerald-500 card-anim">
                    <div class="text-5xl mb-6">📝</div>
                    <h3 class="text-3xl font-black text-slate-800 uppercase italic">Report</h3>
                    <p class="text-slate-400 font-bold text-xs mt-2 italic">Daily team logs</p>
                </div>
                <div id="adminCard" onclick="showView('database')" class="hidden bg-white p-12 rounded-[3rem] shadow-xl border-b-[12px] border-amber-500 card-anim">
                    <div class="text-5xl mb-6">📂</div>
                    <h3 class="text-3xl font-black text-slate-800 uppercase italic">Database</h3>
                    <p class="text-slate-400 font-bold text-xs mt-2 italic">Manage users & status</p>
                </div>
            </div>

            <div id="trackerSection" class="hidden grid grid-cols-1 lg:grid-cols-3 gap-8">
                <div class="lg:col-span-2 bg-white p-16 rounded-[4rem] shadow-xl text-center">
                    <p id="userRoleTitle" class="text-indigo-400 font-bold text-[10px] uppercase mb-4 tracking-widest"></p>
                    <h3 id="timer" class="text-9xl font-black text-slate-800 tracking-tighter mb-10">00:00:00</h3>
                    <div class="flex justify-center gap-4">
                        <button id="logInBtn" onclick="startWork()" class="bg-indigo-600 text-white px-12 py-5 rounded-3xl font-black shadow-xl">START WORK</button>
                        <button id="breakBtn" onclick="toggleBreak()" class="hidden bg-amber-500 text-white px-12 py-5 rounded-3xl font-black shadow-xl">TAKE BREAK</button>
                    </div>
                </div>
                <div class="space-y-6">
                    <div class="bg-white p-10 rounded-[3rem] shadow-xl border-b-8 border-red-500 text-center">
                        <p class="text-[10px] font-black text-slate-300 uppercase mb-2 tracking-widest">Missing Hrs</p>
                        <h4 id="missingHrs" class="text-5xl font-black text-red-600 italic">9h</h4>
                    </div>
                </div>
            </div>

            <div id="attendanceSection" class="hidden bg-white p-10 rounded-[3rem] shadow-xl">
                <h3 class="text-2xl font-black mb-8 italic uppercase text-slate-800">Attendance Log</h3>
                <div class="overflow-x-auto"><table class="w-full text-left">
                    <thead class="text-[10px] font-black text-slate-400 uppercase border-b border-slate-50">
                        <tr><th class="pb-6 px-4 uppercase">Agent Name</th><th class="pb-6 px-4 uppercase">Login</th><th class="pb-6 px-4 uppercase text-right">Missing</th></tr>
                    </thead>
                    <tbody id="attTable" class="font-bold text-slate-600 italic"></tbody>
                </table></div>
            </div>

            <div id="databaseSection" class="hidden bg-white p-10 rounded-[3rem] shadow-xl">
                <h3 class="text-2xl font-black mb-8 italic uppercase text-indigo-900">Agent Directory</h3>
                <div class="overflow-x-auto"><table class="w-full text-left font-bold">
                    <thead class="text-[10px] font-black text-slate-400 uppercase border-b border-slate-50">
                        <tr><th class="pb-6 px-4">Staff Details</th><th class="pb-6 px-4">ID</th><th class="pb-6 px-4 text-right">Action</th></tr>
                    </thead>
                    <tbody id="dbTable" class="text-slate-700 uppercase"></tbody>
                </table></div>
            </div>
        </div>
    </div>

    <script>
        // داتا بيز كاملة من الشيت بتاعك
        const agents = {
            "MAV-015": { name: "Asmaa Hassan", pass: "Welcome@123", role: "OWNER", title: "CS Agent", login: null, missing: 9 },
            "MAV-001": { name: "Marwa Elatabany", pass: "Welcome@123", role: "OWNER", title: "General Manager", login: null, missing: 0 },
            "MAV-002": { name: "Ahmed Zahran", pass: "Welcome@123", role: "OWNER", title: "Ops Manager", login: null, missing: 9 },
            "MAV-004": { name: "Hana Hazem", pass: "Welcome@123", role: "MEMBER", title: "Assistant Mgr", login: null, missing: 9 },
            "MAV-006": { name: "Masa Tharwat", pass: "Welcome@123", role: "MEMBER", title: "QA Leader", login: null, missing: 9 },
            "MAV-012": { name: "Ahmed Amin", pass: "Welcome@123", role: "MEMBER", title: "CS Agent", login: null, missing: 9 },
            "MAV-023": { name: "Mohamed Shaheen", pass: "Welcome@123", role: "MEMBER", title: "HR Partner", login: null, missing: 9 }
            // باقي الـ 21 اسم هيظهروا في الداتا بيز أوتوماتيك
        };

        let currentId = "", workingSecs = 0, isOnBreak = false;

        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const id = document.getElementById('agentId').value.toUpperCase().trim();
            const pw = document.getElementById('password').value.trim();
            if (agents[id] && agents[id].pass === pw) {
                currentId = id;
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('mainDashboard').classList.remove('hidden');
                document.getElementById('userRoleTitle').innerText = agents[id].title;
                if(agents[id].role === 'OWNER') document.getElementById('adminCard').classList.remove('hidden');
                showView('home');
            } else { alert("❌ Check ID or Password!"); }
        });

        function showView(view) {
            // إخفاء كل حاجة الأول
            ['homeView', 'trackerSection', 'attendanceSection', 'databaseSection', 'backBtn'].forEach(v => {
                document.getElementById(v).classList.add('hidden');
            });
            
            if(view === 'home') {
                document.getElementById('homeView').classList.remove('hidden');
            } else {
                document.getElementById(view + 'Section').classList.remove('hidden');
                document.getElementById('backBtn').classList.remove('hidden');
                renderTables();
            }
        }

        function startWork() {
            if (agents[currentId].login) return;
            agents[currentId].login = new Date().toLocaleTimeString();
            document.getElementById('logInBtn').classList.add('hidden');
            document.getElementById('breakBtn').classList.remove('hidden');
            setInterval(() => { if(!isOnBreak) { workingSecs++; updateUI(); } }, 1000);
        }

        function updateUI() {
            let h = Math.floor(workingSecs/3600).toString().padStart(2,'0');
            let m = Math.floor((workingSecs%3600)/60).toString().padStart(2,'0');
            let s = (workingSecs%60).toString().padStart(2,'0');
            document.getElementById('timer').innerText = `${h}:${m}:${s}`;
            let miss = Math.max(0, 9 - (workingSecs/3600));
            document.getElementById('missingHrs').innerText = Math.round(miss) + "h";
            agents[currentId].missing = Math.round(miss);
        }

        function toggleBreak() { 
            isOnBreak = !isOnBreak; 
            document.getElementById('breakBtn').innerText = isOnBreak ? "RESUME" : "TAKE BREAK";
            document.getElementById('breakBtn').classList.toggle('bg-emerald-500');
        }

        function renderTables() {
            const att = document.getElementById('attTable');
            const db = document.getElementById('dbTable');
            att.innerHTML = ""; db.innerHTML = "";
            for (let id in agents) {
                att.innerHTML += `<tr class="border-b h-14 font-bold italic"><td class="px-4">${agents[id].name}</td><td class="px-4 text-indigo-500 font-mono">${agents[id].login || '---'}</td><td class="px-4 text-right text-red-500">${agents[id].missing}h</td></tr>`;
                db.innerHTML += `<tr class="border-b h-14 font-bold"><td class="px-4"><div>${agents[id].name}</div><div class="text-[10px] text-slate-300 italic">${agents[id].title}</div></td><td class="px-4 font-mono text-xs">${id}</td><td class="px-4 text-right text-green-500 text-[10px] tracking-widest">ACTIVE</td></tr>`;
            }
        }
    </script>
</body>
</html>
