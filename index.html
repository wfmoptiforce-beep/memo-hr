<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEMO PRO - Cloud Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        :root { --bg: #050505; --accent: #00d2ff; --glass: rgba(255, 255, 255, 0.03); }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: #fff; margin: 0; }
        .glass-panel { background: var(--glass); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 24px; }
        .sidebar-item:hover, .active-nav { background: rgba(0, 210, 255, 0.1); border-left: 4px solid var(--accent); cursor: pointer; }
        .hidden { display: none !important; }
    </style>
</head>
<body class="min-h-screen flex">

    <div id="loginSection" class="fixed inset-0 z-[100] flex items-center justify-center bg-[#050505] p-6">
        <div class="glass-panel p-12 max-w-md w-full text-center">
            <h1 class="text-3xl font-extrabold italic mb-2 tracking-tighter">MEMO <span class="text-cyan-400">PRO</span></h1>
            <p class="text-slate-500 text-xs uppercase mb-10 tracking-widest">Cloud Intelligence Center</p>
            <form id="loginForm" class="space-y-4">
                <input type="text" id="agentId" required class="w-full px-6 py-4 bg-white/5 border border-white/10 rounded-2xl outline-none focus:border-cyan-400 font-bold uppercase" placeholder="AGENT ID">
                <input type="password" id="password" required class="w-full px-6 py-4 bg-white/5 border border-white/10 rounded-2xl outline-none font-bold focus:border-cyan-400" placeholder="PASSWORD">
                <button type="submit" class="w-full bg-cyan-500 text-black py-5 rounded-2xl font-black text-lg shadow-[0_0_20px_rgba(0,210,255,0.3)] hover:scale-105 transition uppercase">Log In</button>
            </form>
        </div>
    </div>

    <aside id="sidebar" class="hidden w-72 border-r border-white/5 flex flex-col p-8 fixed h-full bg-[#050505] z-50">
        <div class="flex items-center gap-3 mb-12">
            <div class="w-10 h-10 bg-gradient-to-br from-cyan-400 to-blue-600 rounded-xl"></div>
            <h1 class="text-xl font-extrabold italic tracking-tighter uppercase">Memo Pro</h1>
        </div>
        <nav class="space-y-2 flex-grow font-bold text-xs uppercase tracking-widest text-slate-400">
            <div onclick="showTab('dash')" id="nav-dash" class="sidebar-item p-4 rounded-xl active-nav">📊 Dashboard</div>
            <div onclick="showTab('track')" id="nav-track" class="sidebar-item p-4 rounded-xl">⏱️ Live Session</div>
        </nav>
        <button onclick="logout()" class="p-4 rounded-xl bg-red-500/10 text-red-400 font-bold text-xs uppercase hover:bg-red-500/20 transition">Sign Out</button>
    </aside>

    <main id="mainDashboard" class="hidden flex-grow ml-72 p-10">
        <header class="flex justify-between items-center mb-12">
            <div>
                <h2 id="pageTitle" class="text-3xl font-extrabold tracking-tight">Cloud Overview</h2>
                <p id="currentDate" class="text-slate-500 text-sm font-medium"></p>
            </div>
            <div class="glass-panel px-6 py-3 shadow-2xl">
                <span id="globalTimer" class="font-mono text-xl font-bold text-cyan-400">00:00:00</span>
            </div>
        </header>

        <div id="view-dash" class="space-y-8">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="glass-panel p-8 border-b-2 border-cyan-500/30">
                    <p class="text-[10px] font-bold text-slate-500 uppercase mb-2">Active Agents (Live)</p>
                    <h3 id="statActive" class="text-4xl font-extrabold text-cyan-400">0</h3>
                </div>
            </div>
            <div class="glass-panel p-10">
                <h3 class="text-lg font-bold uppercase italic text-slate-300 mb-8 tracking-widest">Live Activity Table</h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-left font-semibold text-sm">
                        <thead class="text-[10px] text-slate-500 uppercase border-b border-white/5">
                            <tr><th class="pb-6">Operator</th><th class="pb-6">ID</th><th class="pb-6">Login Time</th><th class="pb-6 text-right">Status</th></tr>
                        </thead>
                        <tbody id="liveTable"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="view-track" class="hidden h-[60vh] flex items-center justify-center">
            <div class="glass-panel p-20 text-center max-w-2xl w-full border-t-4 border-cyan-400">
                <h3 id="sessionTimer" class="text-9xl font-black mb-12 font-mono">00:00:00</h3>
                <button id="startBtn" onclick="toggleCloudShift()" class="bg-cyan-500 text-black px-16 py-6 rounded-2xl font-black text-xl hover:scale-105 transition shadow-[0_0_30px_rgba(0,210,255,0.3)] uppercase">Start Session</button>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, update, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBmuXinkGPXzeMtLn5paeESkTPfFrr4Z2s",
            authDomain: "memo-pro-eb96d.firebaseapp.com",
            projectId: "memo-pro-eb96d",
            storageBucket: "memo-pro-eb96d.firebasestorage.app",
            messagingSenderId: "973840698231",
            appId: "1:973840698231:web:b364a71587f2ff98b66f72",
            databaseURL: "https://memo-pro-eb96d-default-rtdb.firebaseio.com/"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let currentId = sessionStorage.getItem('memo_id');
        let workSeconds = 0;
        let timer;

        // إظهار التاريخ
        document.getElementById('currentDate').innerText = new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

        // تسجيل الدخول
        document.getElementById('loginForm').onsubmit = (e) => {
            e.preventDefault();
            const id = document.getElementById('agentId').value.toUpperCase().trim();
            const pw = document.getElementById('password').value;
            if(pw === "Welcome@123") {
                sessionStorage.setItem('memo_id', id);
                location.reload();
            } else { alert("Wrong Password!"); }
        };

        // وظيفة العداد والربط بالسيرفر (زي اللي في صورتك)
        window.toggleCloudShift = function() {
            const btn = document.getElementById('startBtn');
            if(btn.innerText === "START SESSION") {
                update(ref(db, 'live_status/' + currentId), {
                    name: currentId === "MAV-015" ? "Asmaa Hassan" : "Agent " + currentId,
                    startTime: new Date().toLocaleTimeString(),
                    status: "Online"
                });
                startTimer();
            } else {
                set(ref(db, 'live_status/' + currentId), null);
                location.reload();
            }
        };

        function startTimer() {
            document.getElementById('startBtn').innerText = "END SESSION";
            document.getElementById('startBtn').classList.replace('bg-cyan-500', 'bg-red-500');
            timer = setInterval(() => {
                workSeconds++;
                const t = new Date(workSeconds * 1000).toISOString().substr(11, 8);
                document.getElementById('sessionTimer').innerText = t;
                document.getElementById('globalTimer').innerText = t;
            }, 1000);
        }

        // مراقبة السيرفر لحظياً (Live Monitoring)
        onValue(ref(db, 'live_status'), (snap) => {
            const data = snap.val() || {};
            document.getElementById('statActive').innerText = Object.keys(data).length;
            const table = document.getElementById('liveTable');
            table.innerHTML = "";
            for(let id in data) {
                table.innerHTML += `
                <tr class="border-b border-white/5 h-16 hover:bg-white/5 transition">
                    <td class="px-4 text-white">${data[id].name}</td>
                    <td class="px-4 text-slate-500 font-mono text-xs">${id}</td>
                    <td class="px-4 text-slate-400">${data[id].startTime}</td>
                    <td class="px-4 text-right text-cyan-400 font-bold">● LIVE</td>
                </tr>`;
            }
        });

        // التنقل بين الصفحات
        window.showTab = (t) => {
            ['dash', 'track'].forEach(v => document.getElementById('view-' + v)?.classList.add('hidden'));
            document.getElementById('view-' + t).classList.remove('hidden');
            document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active-nav'));
            document.getElementById('nav-' + t).classList.add('active-nav');
        };

        window.logout = () => { sessionStorage.clear(); location.reload(); };

        // التحقق من حالة تسجيل الدخول عند الفتح
        if(currentId) {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('sidebar').classList.remove('hidden');
            document.getElementById('mainDashboard').classList.remove('hidden');
            if(currentId !== "MAV-015") showTab('track');
        }
    </script>
</body>
</html>
