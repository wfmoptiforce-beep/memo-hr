<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memo Pro</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>

  <!-- Styles -->
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

<div class="app">

  <!-- LOADING SCREEN -->
  <div id="loading-screen">
    <div class="load-logo">🎯</div>
    <div class="load-text">Memo Pro</div>
    <div class="load-sub">Loading...</div>
    <div class="load-bar"><div class="load-bar-fill"></div></div>
  </div>

  <!-- LOGIN SCREEN -->
  <div id="login-screen">
    <div class="login-left">
      <canvas id="bgCanvas"></canvas>
      <div class="login-left-content">
        <div class="login-logo">🎯</div>
        <div class="login-title">Memo Pro</div>
        <div class="login-sub">Workforce Tool</div>

        <div class="login-features">
          <div class="feat-item">
            <div class="feat-icon">📊</div>
            <div class="feat-text">
              <strong>Real-Time Reports</strong>
              <span>Attrition · Absenteeism · Hours</span>
            </div>
          </div>

          <div class="feat-item">
            <div class="feat-icon">👥</div>
            <div class="feat-text">
              <strong>Agent Management</strong>
              <span>Track status & productivity</span>
            </div>
          </div>

          <div class="feat-item">
            <div class="feat-icon">⏱️</div>
            <div class="feat-text">
              <strong>Live Timeline</strong>
              <span>Breaks · Meetings · Training</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="login-right">
      <div class="login-box">
        <div class="login-welcome">Welcome Back 👋</div>
        <div class="login-welcsub">Sign in to your Memo Pro account</div>

        <div class="inp-group">
          <label>EMAIL</label>
          <div class="inp-wrap">
            <span class="inp-icon">📧</span>
            <input type="email" id="login-email" placeholder="your@email.com">
          </div>
        </div>

        <div class="inp-group">
          <label>PASSWORD</label>
          <div class="inp-wrap">
            <span class="inp-icon">🔒</span>
            <input type="password" id="login-pass" placeholder="••••••••">
          </div>
        </div>

        <div class="forgot-row"><a href="#">Forgot Password?</a></div>
        <button class="login-btn" id="login-btn" onclick="doLogin()">Sign In</button>
        <div class="login-msg" id="login-msg"></div>
      </div>
    </div>
  </div>

  <!-- APP -->
  <div id="app">

    <!-- مثال إصلاح الـ select -->
    <select id="a-status-select" class="status-select">
      <option value="online">🟢 Online</option>
      <option value="break">☕ Break</option>
      <option value="meeting">🧠 Meeting</option>
      <option value="training">🎓 Training</option>
      <option value="offline">🔴 Offline</option>
    </select>

    <!-- باقي الـ APP زي ما هو عندك -->
  </div>

</div>

<!-- JS -->
<script src="js/core/state.js"></script>
<script src="js/core/auth.js"></script>
<script src="js/core/ui.js"></script>
<script src="js/agent/attendance.js"></script>

</body>
</html>
