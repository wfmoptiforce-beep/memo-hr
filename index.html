<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memo Pro - Login</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* Left Side */
    .left-side {
      width: 55%;
      background: linear-gradient(135deg, #0a1628 0%, #0d2461 50%, #1a3a6e 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
    }

    .left-content {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 40px;
    }

    .left-logo {
      width: 80px; height: 80px;
      background: rgba(255,255,255,0.1);
      border: 2px solid rgba(255,255,255,0.2);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      backdrop-filter: blur(10px);
    }

    .left-logo svg {
      width: 40px; height: 40px;
      fill: none; stroke: #fff;
      stroke-width: 2; stroke-linecap: round;
      stroke-linejoin: round;
    }

    .left-title {
      font-size: 42px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    .left-sub {
      font-size: 13px;
      color: rgba(255,255,255,0.5);
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 40px;
    }

    .left-features {
      display: flex;
      flex-direction: column;
      gap: 16px;
      text-align: left;
    }

    .feature-item {
      display: flex;
      align-items: center;
      gap: 14px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 14px 20px;
      backdrop-filter: blur(5px);
    }

    .feature-icon {
      width: 36px; height: 36px;
      background: rgba(255,255,255,0.1);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .feature-text strong {
      display: block;
      color: #fff;
      font-size: 14px;
      margin-bottom: 2px;
    }

    .feature-text span {
      color: rgba(255,255,255,0.4);
      font-size: 12px;
    }

    /* Right Side */
    .right-side {
      width: 45%;
      background: #f8faff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }

    .login-box {
      width: 100%;
      max-width: 380px;
    }

    .welcome-text {
      font-size: 28px;
      font-weight: 800;
      color: #0a1628;
      margin-bottom: 6px;
    }

    .welcome-sub {
      font-size: 14px;
      color: #7a9cc8;
      margin-bottom: 36px;
    }

    .input-group {
      margin-bottom: 18px;
    }

    .input-group label {
      font-size: 12px;
      color: #4a6fa5;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: block;
      margin-bottom: 8px;
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px; height: 16px;
      fill: none; stroke: #b0c4de;
      stroke-width: 2; stroke-linecap: round;
      stroke-linejoin: round;
    }

    .input-wrap input {
      width: 100%;
      padding: 13px 16px 13px 42px;
      border-radius: 12px;
      border: 1.5px solid #e0eaf8;
      background: #ffffff;
      color: #0a1628;
      font-size: 14px;
      outline: none;
      transition: all 0.3s;
    }

    .input-wrap input:focus {
      border-color: #0d47a1;
      box-shadow: 0 0 0 4px rgba(13,71,161,0.08);
    }

    input::placeholder { color: #c5d5e8; }

    .forgot-row {
      display: flex;
      justify-content: flex-end;
      margin-top: -10px;
      margin-bottom: 24px;
    }

    .forgot-row a {
      font-size: 12px;
      color: #0d47a1;
      text-decoration: none;
      font-weight: 600;
    }
    .forgot-row a:hover { text-decoration: underline; }

    .login-btn {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #0a1628, #0d47a1);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 4px 20px rgba(13,71,161,0.3);
      letter-spacing: 0.5px;
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(13,71,161,0.4);
    }

    .login-btn:active { transform: translateY(0); }

    .msg {
      margin-top: 16px;
      font-size: 13px;
      min-height: 20px;
      text-align: center;
      font-weight: 500;
    }

    .divider {
      border: none;
      border-top: 1px solid #e8f0fb;
      margin: 28px 0;
    }

    .footer-text {
      text-align: center;
      font-size: 12px;
      color: #b0c4de;
    }

    .footer-text a {
      color: #0d47a1;
      text-decoration: none;
      font-weight: 600;
    }
    .footer-text a:hover { text-decoration: underline; }

    /* Responsive */
    @media (max-width: 768px) {
      .left-side { display: none; }
      .right-side { width: 100%; }
    }
  </style>
</head>
<body>

  <!-- Left Side -->
  <div class="left-side">
    <canvas id="bgCanvas"></canvas>
    <div class="left-content">
      <div class="left-logo">
        <svg viewBox="0 0 24 24">
          <line x1="12" y1="19" x2="12" y2="5"/>
          <polyline points="5 12 12 5 19 12"/>
        </svg>
      </div>
      <div class="left-title">Memo Pro</div>
      <div class="left-sub">Workforce Tool</div>

      <div class="left-features">
        <div class="feature-item">
          <div class="feature-icon">📊</div>
          <div class="feature-text">
            <strong>Real-Time Reports</strong>
            <span>Attrition · Absenteeism · Hours</span>
          </div>
        </div>
        <div class="feature-item">
          <div class="feature-icon">👥</div>
          <div class="feature-text">
            <strong>Agent Management</strong>
            <span>Track status & productivity</span>
          </div>
        </div>
        <div class="feature-item">
          <div class="feature-icon">⏱️</div>
          <div class="feature-text">
            <strong>Live Timeline</strong>
            <span>Breaks · Meetings · Training</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Right Side -->
  <div class="right-side">
    <div class="login-box">

      <div class="welcome-text">Welcome Back 👋</div>
      <div class="welcome-sub">Sign in to your Memo Pro account</div>

      <div class="input-group">
        <label>Email</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
          <input type="email" id="email" placeholder="your@email.com" />
        </div>
      </div>

      <div class="input-group">
        <label>Password</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input type="password" id="password" placeholder="••••••••" />
        </div>
      </div>

      <div class="forgot-row">
        <a href="#">Forgot Password?</a>
      </div>

      <button class="login-btn" onclick="login()">Sign In</button>

      <div class="msg" id="msg"></div>

      <hr class="divider">

      <div class="footer-text">
        Need help? <a href="mailto:admin@memopro.com">Contact Your Administrator</a>
      </div>

    </div>
  </div>

  <script>
    // Animated Canvas - Floating Targets
    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    const targets = [];
    for (let i = 0; i < 25; i++) {
      targets.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 30 + 10,
        speed: Math.random() * 0.6 + 0.2,
        alpha: Math.random() * 0.2 + 0.05,
        pulse: Math.random() * Math.PI * 2
      });
    }

    function drawTarget(x, y, size, alpha) {
      ctx.save();
      ctx.globalAlpha = alpha;

      // Outer ring
      ctx.beginPath();
      ctx.arc(x, y, size, 0, Math.PI * 2);
      ctx.strokeStyle = '#4a90d9';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // Middle ring
      ctx.beginPath();
      ctx.arc(x, y, size * 0.6, 0, Math.PI * 2);
      ctx.strokeStyle = '#6ab0f5';
      ctx.lineWidth = 1;
      ctx.stroke();

      // Inner ring
      ctx.beginPath();
      ctx.arc(x, y, size * 0.3, 0, Math.PI * 2);
      ctx.strokeStyle = '#90caff';
      ctx.lineWidth = 1;
      ctx.stroke();

      // Center dot
      ctx.beginPath();
      ctx.arc(x, y, size * 0.08, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();

      // Cross lines
      ctx.strokeStyle = 'rgba(255,255,255,0.3)';
      ctx.lineWidth = 0.8;
      ctx.beginPath();
      ctx.moveTo(x - size * 1.3, y);
      ctx.lineTo(x + size * 1.3, y);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x, y - size * 1.3);
      ctx.lineTo(x, y + size * 1.3);
      ctx.stroke();

      ctx.restore();
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      targets.forEach(t => {
        t.y -= t.speed;
        t.pulse += 0.02;
        const pulsedAlpha = t.alpha + Math.sin(t.pulse) * 0.03;

        if (t.y + t.size < 0) {
          t.y = canvas.height + t.size;
          t.x = Math.random() * canvas.width;
        }

        drawTarget(t.x, t.y, t.size, pulsedAlpha);
      });

      requestAnimationFrame(animate);
    }

    animate();

    // Login Function
    async function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const msg = document.getElementById('msg');
      const btn = document.querySelector('.login-btn');

      if (!email || !password) {
        msg.textContent = '⚠️ Please enter your email and password';
        msg.style.color = '#e53935';
        return;
      }

      btn.textContent = 'Signing in...';
      btn.disabled = true;
      msg.textContent = '';

const { data, error } = await window.supabase.auth.signInWithPassword({        email, password
      });

      if (error) {
        msg.textContent = '❌ ' + error.message;
        msg.style.color = '#e53935';
        btn.textContent = 'Sign In';
        btn.disabled = false;
      } else {
        msg.textContent = '✅ Login successful! Redirecting...';
        msg.style.color = '#2e7d32';
        setTimeout(() => window.location.href = 'dashboard.html', 1200);
      }
    }

    // Enter key support
    document.addEventListener('keypress', e => {
      if (e.key === 'Enter') login();
    });
  </script>

</body>
</html>
