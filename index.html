<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEMO Workforce - Dark Blue Edition</title>
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/912/912214.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap');
        body { font-family: 'Inter', sans-serif; background: #f0f7ff; }
        .hidden { display: none !important; }
        .bg-navy { background-color: #001f3f; }
        .text-navy { color: #001f3f; }
        .border-navy { border-color: #001f3f; }
        .bg-sky { background-color: #39cccc; }
        .status-active { background-color: #e0f2fe; color: #0369a1; }
        .status-inactive { background-color: #fee2e2; color: #991b1b; }
        .card-shadow { box-shadow: 0 10px 30px rgba(0, 31, 63, 0.1); }
    </style>
</head>
<body class="min-h-screen">

    <div id="loginSection" class="flex items-center justify-center min-h-screen p-4">
        <div class="bg-white rounded-[2rem] overflow-hidden flex w-full max-w-4xl card-shadow min-h-[500px]">
            <div class="w-full md:w-1/2 p-12 flex flex-col justify-center">
                <div class="flex items-center gap-2 mb-8">
                    <span class="text-4xl font-black text-navy italic tracking-tighter">MEMO</span>
                    <span class="text-xs font-bold text-sky uppercase">Workforce</span>
                </div>
                <h2 class="text-2xl font-bold text-navy mb-6">Welcome Back</h2>
                <form id="loginForm" class="space-y-4">
                    <div class="space-y-1">
                        <label class="text-[10px] font-bold text-slate-400 uppercase">Agent ID</label>
                        <input type="text" id="agentId" required autocomplete="username" class="w-full px-5 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-navy transition font-bold" placeholder="MAV-015">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] font-bold text-slate-400 uppercase">Password</label>
                        <input type="password" id="password" required autocomplete="current-password" class="w-full px-5 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-navy transition font-bold" placeholder="••••••••">
                    </div>
                    <button type="submit" class="w-full bg-navy text-white py-4 rounded-xl font-bold hover:bg-slate-800 transition shadow-lg mt-4">Log In</button>
                </form>
            </div>
            <div class="hidden md:flex w-1/2 bg-navy p-12 flex flex-col justify-center text-white relative">
                <div class="z-10">
                    <h2 class="text-4xl font-black mb-4">Turn your ideas into reality.</h2>
                    <p class="text-sky font-bold text-sm">Consistent quality and experience across all platforms.</p>
                </div>
                <div class="absolute bottom-0 right-0 w-64 h-64 bg-sky/10 rounded-full blur-3xl -mb-20 -mr-20"></div>
            </div>
        </div>
    </div>

    <div id="mainDashboard" class="hidden">
        <nav class="bg-navy p-6 shadow-xl flex justify-between items-center sticky top-0 z-50">
            <h1 class="text-2xl font-black text-white italic tracking-tighter cursor-pointer" onclick="showView('home')">MEMO</h1>
            <div id="navTimer" class="bg-sky/20 px-4 py-2 rounded-xl border border-sky/30 font-mono font-black text-sky hidden">00:00:00</div>
            <button onclick="location.reload()" class="bg-white/10 text-white px-5 py-2 rounded-xl font-bold text-[10px] hover:bg-white/20">LOGOUT</button>
        </nav>

        <div class="max-w-7xl mx-auto p-6">
            <div id="homeView" class="grid grid-cols-1 md:grid-cols-3 gap-8 py-10">
                <div onclick="showView('tracker')" class="bg-white p-10 rounded-[2.5rem] card-shadow border-t-8 border-navy hover:-translate-y-2 transition cursor-pointer">
                    <div class="text-4xl mb-4">⏱️</div>
                    <h3 class="text-xl font-black text-navy uppercase italic">Live Tracker</h3>
                    <p class="text-slate-400 font-bold text-[10px] uppercase">Login & Break Control</p>
                </div>
                <div id="adminBtn1" onclick="showView('report')" class="hidden bg-white p-10 rounded-[2.5rem] card-shadow border-t-8 border-sky hover:-translate-y-2 transition cursor-pointer">
                    <div class="text-4xl mb-4">📊</div>
                    <h3 class="text-xl font-black text-navy uppercase italic">Attendance Log</h3>
                    <p class="text-slate-400 font-bold text-[10px] uppercase">Daily Reports</p>
                </div>
                <div id="adminBtn2" onclick="showView('database')" class="hidden bg-white p-10 rounded-[2.5rem] card-shadow border-t-8 border-navy hover:-translate-y-2 transition cursor-pointer">
                    <div class="text-4xl mb-4">⚙️</div>
                    <h3 class="text-xl font-black text-navy uppercase italic">Database</h3>
                    <p class="text-slate-400 font-bold text-[10px] uppercase">User Management</p>
                </div>
            </div>

            <div id="databaseSection" class="hidden">
                <button onclick="showView('home')" class="mb-6 font-bold text-navy text-xs uppercase tracking-widest">← Back to Menu</button>
                <div class="bg-white rounded-[2rem] p-8 card-shadow overflow-hidden border border-slate-100">
                    <div class="flex justify-between items-center mb-8">
                        <h3 class="text-xl font-black text-navy uppercase tracking-tighter">User Management Table</h3>
                        <button onclick="addNewAgent()" class="bg-navy text-white px-6 py-2 rounded-xl text-[10px] font-black">+ ADD NEW STAFF</button>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left">
                            <thead class="bg-slate-50 text-[10px] font-black text-slate-400 uppercase tracking-widest">
                                <tr>
                                    <th class="py-5 px-6">Agent Name</th>
                                    <th class="py-5 px-6">ID</th>
                                    <th class="py-5 px-6">Current Status</th>
                                    <th class="py-5 px-6 text-right">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="dbTable" class="text-sm font-bold text-navy"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div id="trackerSection" class="hidden py
