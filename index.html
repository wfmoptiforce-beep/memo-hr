<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEMO Workforce - Professional Dashboard</title>
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/912/912214.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background: #f4f7fa; }
        .hidden { display: none !important; }
        .sidebar { background-color: #8e54e9; background-image: linear-gradient(180deg, #4776e6 0%, #8e54e9 100%); }
        .stat-card { background: white; border-radius: 1rem; padding: 1.5rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); border-left: 5px solid; }
        .sidebar-item:hover { background: rgba(255,255,255,0.1); cursor: pointer; }
        .active-link { background: rgba(255,255,255,0.2); border-left: 4px solid white; }
    </style>
</head>
<body class="min-h-screen">

    <div id="loginSection" class="flex items-center justify-center min-h-screen p-4">

                <h1 class="text-3xl font-black text-indigo-700 italic mb-8 uppercase tracking-tighter">MEMO Dashboard</h1>
                <form id="loginForm" class="space-y-4">
                    <input type="text" id="agentId" required class="w-full px-5 py-3 border rounded-xl outline-none focus:border-indigo-500 font-bold uppercase" placeholder="AGENT ID">
                    <input type="password" id="password" required class="w-full px-5 py-3 border rounded-xl outline-none focus:border-indigo-500 font-bold" placeholder="PASSWORD">
                    <button type="submit" class="w-full bg-indigo-600 text-white py-4 rounded-xl font-black shadow-lg">Login to Admin Panel</button>
                </form>
            </div>
            <div class="hidden md:flex w-1/2 sidebar p-12 flex flex-col justify-center text-white text-center">
                <h2 class="text-4xl font-black mb-4">Mavin Command Center</h2>
                <p class="font-bold opacity-80">Consistent quality and experience across all platforms.</p>
            </div>
        </div>
    </div>

                <h1 class="text-xl font-black italic tracking-tighter uppercase">MEMO HR</h1>
            </div>

                <div onclick="showTab('users')" class="sidebar-item p-3 rounded-lg flex items-center gap-3"><span class="text-lg">👥</span> Users</div>
                <div onclick="showView('tracker')" class="sidebar-item p-3 rounded-lg flex items-center gap-3"><span class="text-lg">⏱️</span> Live Tracker</div>
                <div onclick="alert('Coming Soon')" class="sidebar-item p-3 rounded-lg flex items-center gap-3"><span class="text-lg">📊</span> Reports</div>
                <div onclick="alert('Coming Soon')" class="sidebar-item p-3 rounded-lg flex items-center gap-3"><span class="text-lg">⚙️</span> Settings</div>
            </nav>
            <button onclick="location.reload()" class="mt-auto p-3 rounded-lg hover:bg-red-500/20 text-red-200 flex items-center gap-3 font-bold uppercase text-xs">🚪 Logout</button>
        </div>

                    <p class="text-xs text-slate-400 font-bold">This is your admin dashboard center.</p>
