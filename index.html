<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEMO Workforce - Space Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background: #fdf2f8; }
        .hidden { display: none !important; }
        .sidebar { background: linear-gradient(180deg, #4776e6 0%, #8e54e9 100%); }
    </style>
</head>
<body class="min-h-screen">

    <div id="loginSection" class="flex items-center justify-center min-h-screen p-4 md:p-10">
        <div class="bg-white rounded-[2rem] shadow-2xl w-full max-w-6xl flex overflow-hidden min-h-[600px] border border-slate-100">
            <div class="w-full md:w-1/2 p-10 md:p-16 flex flex-col justify-center">
                <div class="mb-10 text-center md:text-left">
                    <span class="text-4xl">⚡</span>
                    <h1 class="text-4xl font-extrabold text-slate-900 mt-4 mb-2">Welcome Back</h1>
                    <p class="text-slate-500 font-medium text-sm">Sign in to access your account</p>
                </div>
                <button onclick="alert('Google Login coming soon!')" class="w-full flex items-center justify-center gap-3 border border-slate-200 py-3.5 rounded-xl hover:bg-slate-50 transition mb-6">
                    <img src="https://authjs.dev/img/providers/google.svg" class="w-5 h-5" alt="Google">
                    <span class="text-slate-600 font-semibold text-sm">Sign in with Google</span>
                </button>
                <div class="relative flex items-center mb-8">
                    <div class="flex-grow border-t border-slate-100"></div>
                    <span class="flex-shrink mx-4 text-xs font-medium text-slate-300 uppercase">or Sign in with Email</span>
                    <div class="flex-grow border-t border-slate-100"></div>
                </div>
                <form id="loginForm" class="space-y-5 text-left">
                    <div class="space-y-1">
                        <label class="text-xs font-semibold text-slate-700 ml-1">Agent ID</label>
                        <input type="text" id="agentId" required autocomplete="username" class="w-full px-6 py-4 bg-slate-50 border border-slate-100 rounded-xl outline-none font-bold uppercase focus:border-indigo-500 transition" placeholder="MAV-015">
                    </div>
                    <div class="space-y-1">
                        <label class="text-xs font-semibold text-slate-700 ml-1">Password</label>
                        <input type="password" id="password" required autocomplete="current-password" class="w-full px-6 py-4 bg-slate-50 border border-slate-100 rounded-xl outline-none font-bold focus:border-indigo-500 transition" placeholder="••••••••">
                    </div>
                    <div class="flex justify-between items-center text-xs font-medium px-1">
                        <label class="flex items-center gap-2 text-slate-600 cursor-pointer">
                            <input type="checkbox" class="accent-indigo-600 w-4 h-4"> Remember me
                        </label>
                        <a href="#" class="text-indigo-600 hover:underline">Forgot Password?</a>
                    </div>
                    <button type="submit" class="w-full bg-[#bf8fbf] text-white py-5 rounded-xl font-bold text-lg hover:bg-[#a67ba6] shadow-xl transition transform active:scale-95">Login</button>
                </form>
            </div>
            <div class="hidden md:flex w-1/2 p-10 flex flex-col justify-end bg-slate-900 text-center relative overflow-hidden">
                <img src="https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&q=80&w=1000" class="absolute inset-0 object-cover opacity-60 w-full h-full" alt="Background">
                <div class="z-10 bg-white/20 backdrop-blur-md p-8 rounded-3xl border border-white/30 mb-4">
                    <h2 class="text-2xl font-extrabold text-white mb-3 tracking-tight">Turn your ideas into reality.</h2>
                    <p class="text-xs font-semibold text-indigo-100 leading-relaxed opacity-90">Consistent quality and experience across all platforms and devices.</p>
                </div>
            </div>
        </div>
    </div>

    <div id="mainDashboard" class="hidden flex min-h-screen">
        <div class="w-64 sidebar text-white flex flex-col p-6 fixed h-full shadow-2xl">
            <h1 class="text-2xl font-black italic mb-10 tracking-tighter uppercase">MEMO HR</h1>
            <nav class="space-y-4 flex-grow">
                <div onclick="location.reload()" class="p-3 rounded-lg bg-white/20 font-bold cursor-pointer">🏠 Dashboard</div>
                <div onclick="alert('Opening Users...')" class="p-3 rounded-lg hover:bg-white/10 font-bold cursor-pointer">👥 Users</div>
            </nav>
            <button onclick="location.reload()" class="p-3 rounded-lg bg-red-500/20 text-red-200 font-bold uppercase text-xs"> Logout</button>
        </div>
        <div class="flex-grow ml-64 p-10">
            <h2 id="welcomeUser" class="text-3xl font-black text-slate-800 uppercase italic mb-8">Welcome Back!</h2>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-10">
                <div class="bg-white p-6 rounded-3xl shadow-sm border-l-8 border-indigo-500">
                    <p class="text-[10px] font-black text-slate-400 uppercase">Total Schedule</p>
                    <h4 class="text-3xl font-black text-indigo-700">346</h4>
                </div>
                </div>
        </div>
    </div>

    <script>
        // داتا الموظفين - اتأكدي إنك بتكتبي الباسورد بالظبط
        const agents = {
            "MAV-015": { name: "Asmaa Hassan", pass: "Welcome@123", role: "ADMIN" },
            "MAV-002": { name: "Ahmed Zahran", pass: "Welcome@123", role: "ADMIN" },
            "MAV-001": { name: "Marwa Elatabany", pass: "Welcome@123", role: "AGENT" }
        };

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const id = document.getElementById('agentId').value.toUpperCase().trim();
            const pw = document.getElementById('password').value;

            console.log("Attempting Login:", id, pw);

            if (agents[id]) {
                if (agents[id].pass === pw) {
                    document.getElementById('loginSection').classList.add('hidden');
                    document.getElementById('mainDashboard').classList.remove('hidden');
                    document.getElementById('welcomeUser').innerText = "Welcome Back, " + agents[id].name;
                } else {
                    alert("❌ Wrong Password! (Make sure W is capital)");
                }
            } else {
                alert("❌ Agent ID Not Found!");
            }
        });
    </script>
</body>
</html>
