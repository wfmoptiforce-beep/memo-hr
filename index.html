<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEMO Workforce</title>
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/912/912214.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background: #f0f4f8; overflow-x: hidden; }
        .hidden { display: none !important; }
        .card-anim:hover { transform: translateY(-10px); transition: 0.3s; }
    </style>
</head>
<body class="min-h-screen">

    <div id="loginSection" class="flex items-center justify-center min-h-screen p-4">
        <div class="bg-white p-12 rounded-[3.5rem] shadow-2xl w-full max-w-md border-b-[15px] border-indigo-600 text-center">
            <h1 class="text-4xl font-black text-indigo-700 italic mb-2">MEMO</h1>
            <p class="text-gray-400 font-bold text-[10px] uppercase mb-8 italic">Mavin Workforce Dashboard</p>
            <form id="loginForm" class="space-y-4 text-left">
                <div>
                    <label class="text-[10px] font-black ml-2 text-gray-400 uppercase">Agent ID</label>
                    <input type="text" id="agentId" name="username" required autocomplete="username" class="w-full px-6 py-4 bg-slate-50 border-2 border-transparent rounded-2xl outline-none font-bold focus:border-indigo-500 uppercase" placeholder="MAV-015">
                </div>
                <div>
                    <label class="text-[10px] font-black ml-2 text-gray-400 uppercase">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password" class="w-full px-6 py-4 bg-slate-50 border-2 border-transparent rounded-2xl outline-none font-bold focus:border-indigo-500" placeholder="••••••••">
                </div>
                <button type="submit" class="w-full bg-indigo-600 text-white py-5 rounded-2xl font-black text-lg shadow-xl hover:bg-indigo-700 transition">LOG IN</button>
            </form>
        </div>
    </div>

    <div id="mainDashboard" class="hidden animate-fade-in">
        <nav class="bg-white p-6 shadow-sm flex justify-between items-center sticky top-0 z-50">
            <h1 class="text-2xl font-black text-indigo-600 italic tracking-tighter cursor-pointer" onclick="showView('home')">MEMO</h1>
            <div class="flex items-center gap-4 text-xs font-bold text-slate-500 italic">
                <span id="welcomeMsg"></span>
                <button onclick="location.reload()" class="bg-red-50 text-red-500 px-4 py-2 rounded-xl">LOGOUT</button>
            </div>
        </nav>

        <div class="max-w-7xl mx-auto p-6">
            
            <button id="backBtn" onclick="showView('home')" class="hidden mb-6 bg-white p-4 rounded-2xl shadow-sm hover:bg-slate-50 font-black">⬅ BACK TO MENU</button>

            <div id="homeView" class="grid grid-cols-1 md:grid-cols-3 gap-8 mt-10">
                <div onclick="showView('tracker')" class="bg-white p-12 rounded-[4rem] shadow-xl border-b-[12px] border-indigo-500 card-anim cursor-pointer">
                    <div class="text-5xl mb-6">⏱️</div>
                    <h3 class="text-3xl font-black text-slate-800 uppercase italic">Live Tracker</h3>
                    <p class="text-slate-400 font-bold text-xs mt-2">Start your shift & track hours.</p>
                </div>
                <div onclick="showView('attendance')" class="bg-white p-12 rounded-[4rem] shadow-xl border-b-[12px] border-emerald-500 card-anim cursor-pointer">
                    <div class="text-5xl mb-6">📝</div>
                    <h3 class="text-3xl font-black text-slate-800 uppercase italic">Attendance</h3>
                    <p class="text-slate-400 font-bold text-xs mt-2">Daily reports & logs.</p>
                </div>
                <div id="adminCard" onclick="showView('database')" class="hidden bg-white p-12 rounded-[4rem] shadow-xl border-b-[12px] border-amber-500 card-anim cursor-pointer">
                    <div class="text-5xl mb-6">📂</div>
                    <h3 class="text-3xl font-black text-slate-800 uppercase italic">Database</h3>
                    <p class="text-slate-400 font-bold text-xs mt-2">Manage staff & status.</p>
                </div>
            </div>

            <div id="trackerSection" class="hidden grid grid-cols-1 lg:grid-cols-3 gap-8">
                <div class="lg:col-span-2 bg-white p-16 rounded-[4rem] shadow-xl text-center">
                    <h3 id="timer" class="text-9xl font-black text-slate-800 tracking-tighter mb-10">00:00:00</h3>
                    <div class="flex justify-center gap-4">
                        <button id="logInBtn" onclick="startTracker()" class="bg-indigo-600 text-white px-12 py-5 rounded-3xl font-black shadow-xl">START SHIFT</button>
                        <button id="breakBtn" onclick="toggleBreak()" class="hidden bg-amber-500 text-white px-12 py-5 rounded-3xl font-black shadow-xl">TAKE BREAK</button>
                    </div>
                </div>
                <div class="space-y-6">
                    <div class="bg-white p-10 rounded-[3rem] shadow-xl border-b-8 border-red-500 text-center">
                        <p class="text-[10px] font-black text-slate-300 uppercase mb-2">Missing Hrs</p>
                        <h4 id="missingHrs" class="text-5xl font-black text-red-600 italic">9h</h4>
                    </div>
                </div>
            </div>

            <div id="attendanceSection" class="hidden bg-white p-10 rounded-[3.5rem] shadow-xl">
                <h3 class="text-2xl font-black mb-8 italic uppercase">Team Attendance</h3>
                <div class="overflow-x-auto"><table class="w-
